name: Import verified Forge Studio source

on:
  push:
    branches: [main]
    paths: ['.bootstrap/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore checksum-verified source
        run: python3 .bootstrap/import.py
      - name: Validate core
        run: npm test
      - name: Recreate portable application
        run: |
          npm run build:standalone
          echo '6c3653afd2a05c5c6b04af56156f04c31c75fcd7c5788a5f1ce825fabfc42240  ForgeStudio.html' | sha256sum --check
      - name: Commit complete source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore LICENSE README.md docs index.html package.json src styles.css tests tools vendor ForgeStudio.html
          if ! git diff --cached --quiet; then
            git commit -m 'Import Forge Studio source, WebGPU editor, tests and portable build'
            git push origin HEAD:main
          fi
      - name: Install browser test tooling
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Run Chromium integration tests and capture screenshots
        run: python3 tests/browser_e2e.py
      - name: Commit verified browser results
        run: |
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m 'Record passing Chromium integration tests and UI screenshots'
            git push origin HEAD:main
          fi
