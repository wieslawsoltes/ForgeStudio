name: Publish Forge Studio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run core tests and build portable application
        run: |
          npm test
          npm run build:standalone
          git diff --exit-code -- ForgeStudio.html
      - name: Install browser test tooling
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Validate standalone application in Chromium
        run: python3 tests/browser_e2e.py
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html styles.css ForgeStudio.html LICENSE _site/
          cp -R src vendor _site/
          touch _site/.nojekyll
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync("_site/deployment.json", JSON.stringify({source_commit:process.env.GITHUB_SHA}, null, 2) + "\n");'
      - name: Publish static files to gh-pages
        run: |
          git fetch origin gh-pages
          site="$RUNNER_TEMP/forge-pages"
          git worktree add --detach "$site" FETCH_HEAD
          rsync -a --delete --exclude=.git _site/ "$site/"
          git -C "$site" config user.name 'github-actions[bot]'
          git -C "$site" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$site" add --all
          if ! git -C "$site" diff --cached --quiet; then
            git -C "$site" commit -m "Deploy Forge Studio ${GITHUB_SHA}"
            git -C "$site" push origin HEAD:gh-pages
          fi
      - name: Request GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '{build_type, source, html_url}'
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
      - name: Verify published revision and static asset integrity
        run: python3 tools/verify-deployment.py "https://wieslawsoltes.github.io/ForgeStudio/" "$GITHUB_SHA" _site
      - name: Validate live application in Chromium
        env:
          FORGE_URL: https://wieslawsoltes.github.io/ForgeStudio/
        run: python3 tests/browser_e2e.py
      - name: Upload browser verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-browser-verification
          path: |
            docs/browser-test-results.json
            docs/screenshot-*.png
          retention-days: 14
